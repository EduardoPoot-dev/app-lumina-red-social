<div class="flex justify-center items-center pb-4">
  <button
    class="rounded py-1 px-4 text-sm bg-indigo-600 text-white mr-4 disabled:bg-indigo-400 disabled:cursor-not-allowed"
    [routerLink]="[]"
    [queryParams]="{ page: prevPage() }"
    [disabled]="page() === 1"
  >Anterior</button>

  <button
    class="rounded py-1 px-4 text-sm bg-indigo-600 text-white disabled:bg-indigo-400 disabled:cursor-not-allowed"
    [routerLink]="[]"
    [queryParams]="{ page: nextPage() }"
    [disabled]="page() >= totalPages()"
  >Siguiente</button>
</div>
