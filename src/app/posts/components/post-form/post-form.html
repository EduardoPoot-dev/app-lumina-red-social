<form novalidate class="mt-5 " (submit)="submitForm($event)">
  <div >
    <label for="post" class="block font-inter font-semibold text-sm text-gray-500">Contenido de la publicación</label>
    <textarea
      [formField]="postForm.content"
      class="w-full p-4 mt-1 rounded-lg bg-indigo-50"
      id="post"
      rows="4"
      placeholder="¿Qué quieres compartir hoy? Escribe tu publicación ahí"
    ></textarea>
  </div>

  @if(postForm.content().invalid() && postForm.content().touched()) {
    <shared-error-messages [errors]="postForm.content().errors()"></shared-error-messages>

  }

  <div class="relative mt-2">
    <label for="post-image" class="block font-inter font-semibold text-sm text-gray-500">Adjuntar archivo</label>
    <input
      id="post-image"
      (change)="onFilesChange($event)"
      class="w-full p-3 pl-12 mt-1 rounded-lg text-sm bg-indigo-50 "
      type="file"
    />
    <svg class="absolute top-9 left-3 text-indigo-800 " [size]="18" lucidePaperclip></svg>
  </div>

  <div class="grid grid-cols-4 mt-5 gap-3">
    <!-- Ya guardadas en la DB -->
    @for (img of existingImages(); track img.id) {
      <figure class="preview relative">
        <img [src]="backendUrl + img.imageUrl" [alt]="img.id" />
        <button class="p-1 size-8 rounded bg-red-600 text-white absolute top-0 right-0" type="button" (click)="removeExisting(img.id)">✕</button>
      </figure>
    }

    <!-- Nuevas, aún sin subir -->
    @for (item of newPreviews(); track item; let i = $index) {
      <figure class="preview relative">
        <img [src]="item" [alt]="item" />
        <span class="badge absolute -top-1 -left-1 p-1 rounded bg-indigo-600 text-white text-xs">Nueva</span>
        <button class="p-1 size-8 rounded bg-red-600 text-white absolute top-0 right-0" type="button" (click)="removeNew(i)">✕</button>
      </figure>
    }
  </div>

  <div class="flex justify-end gap-2 mt-8">
    <a class="block px-8 py-1 bg-indigo-100 hover:bg-indigo-200 transition-colors font-semibold text-sm rounded-2xl" routerLink="/dashboard"
    >Cancelar</a>

    <button type="submit" class="flex gap-1 items-center px-8 py-1 bg-indigo-700 hover:bg-indigo-800 transition-colors font-semibold text-sm text-white rounded-2xl">
      <span>{{isEditMode() ? 'Guardar cambios' : 'Publicar'}}</span>
      <svg lucideSendHorizontal [size]="16"></svg>
    </button>
  </div>
</form>
