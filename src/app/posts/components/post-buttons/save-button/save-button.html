<div class="flex items-center gap-1">
  <button [disabled]="notAuthenticated()" (click)="toggleSaved()" [ngClass]="{
    'text-gray-500': !savedPost(),
    'text-indigo-600': savedPost()
  }"
    class="group flex items-center disabled:cursor-default disabled:text-gray-300 disabled:hover:text-gray-300  gap-2 text-gray-500 hover:text-indigo-600 cursor-pointer transition-colors">
    <div [ngClass]="{
      'group-hover:bg-white': notAuthenticated(),
      'bg-indigo-100': savedPost()
    }" class="p-1.5 rounded-xl group-hover:bg-indigo-100 transition-colors">
      <svg lucideBookmark [size]="20"></svg>
    </div>
  </button>
  <span class="text-gray-500">{{ savesPostCount() }}</span>
</div>
