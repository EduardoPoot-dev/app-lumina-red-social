<div class="flex items-center gap-3">
  <figure>
    <img class="size-10 object-cover rounded-full"
      [src]="profilePhoto()" alt="image user" />
  </figure>
  <a [routerLink]="['/users', userResource.value()?.id]" class="font-bold text-xl cursor-pointer">
    {{userResource.value()?.name}}
  </a>
  <p class="text-gray-600 text-sm">@{{userResource.value()?.username}}</p>
  <!-- <span class="py-1 px-2 rounded bg-indigo-100 text-xs">Te sigue</span> -->
</div>
