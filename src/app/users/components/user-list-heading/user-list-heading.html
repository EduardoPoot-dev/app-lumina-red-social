<div class="flex items-center justify-between">

  <a [routerLink]="returnPath()" class="flex gap-2 items-center text-gray-600 p-2 px-4 rounded-2xl font-semibold">
    <svg lucideArrowLeft [size]="20"></svg>
    Ir a dashboard
  </a>

  <div class="flex gap-2">
    <h1 class="font-bold text-2xl">{{title()}}</h1>
    <div class="bg-indigo-100 text-xs p-2 px-3 rounded-3xl font-bold">
      <span class="text-indigo-700">{{followCount()}} </span>
    </div>
  </div>

</div>
