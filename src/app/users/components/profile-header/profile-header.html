<div class="w-200 mx-auto">
  <div class="grid gap-3 grid-cols-5 items-end">
  <figure class="col-span-1 size-45 border-8 border-white rounded-full overflow-hidden">
    <img class="size-full object-cover" [src]="user().profilePhoto ? `${baseUrl}/${user().profilePhoto?.imageUrl}` : './user.png'" />
  </figure>

  <div class="col-span-4 ml-3 p-6 flex justify-between items-end">
    <div>
      <h1 class="text-4xl font-bold capitalize">{{ user().name }}</h1>
      <p class="lowercase text-gray-700">@{{ user().username }}</p>
    </div>

    <div>
      @if(!isMyProfilePage() && isAuthenticated()) {
        <button
          (click)="toggleFollow()"
          class="bg-indigo-700 py-2 px-10 rounded-3xl cursor-pointer text-white"
        >
          <svg [size]="15" lucideUserRoundPlus class="inline mr-1"></svg>
          <span class="font-semibold">{{buttonText()}}</span>
        </button>
      }
    </div>
  </div>
  </div>

  <user-follow-stats [user]="user()"></user-follow-stats>
</div>
